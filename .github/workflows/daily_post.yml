name: Autonomous Daily Shorts & Reels Pipeline

on:
  # Automated schedule disabled: Local PC Task Scheduler handles daily publishing with full 1080p Coverr video footage
  # schedule:
  #   - cron: '0 5,13,21 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Custom Topic Override (leave empty to pick next from queue)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry Run (generate script and audio only, skip render and upload)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: autonomous-shorts-pipeline
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python TTS Engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎬 Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: 🐧 Detect Headless Browser
        run: |
          CHROME_PATH=$(which google-chrome || which google-chrome-stable || which chromium-browser || which chromium || true)
          if [ -n "$CHROME_PATH" ]; then
            echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> $GITHUB_ENV
            echo "Using browser binary at: $CHROME_PATH"
          fi

      - name: 📦 Install NPM Dependencies & Ensure Browser
        run: |
          npm ci
          npx remotion browser ensure || true

      - name: 🎬 Execute Autonomous Production Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          MONETIZATION_AFFILIATE_URL: ${{ secrets.MONETIZATION_AFFILIATE_URL }}
          MONETIZATION_NEWSLETTER_URL: ${{ secrets.MONETIZATION_NEWSLETTER_URL }}
        run: |
          BUILD_CMD="npm run build:daily"
          
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            BUILD_CMD="$BUILD_CMD -- --dry-run"
          fi
          
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            BUILD_CMD="$BUILD_CMD -- --topic \"${{ github.event.inputs.topic }}\""
          fi
          
          echo "Executing: $BUILD_CMD"
          eval $BUILD_CMD

      - name: 🚀 Publish Video to YouTube Shorts & Instagram Reels
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS || 'public' }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          MONETIZATION_AFFILIATE_URL: ${{ secrets.MONETIZATION_AFFILIATE_URL }}
          MONETIZATION_NEWSLETTER_URL: ${{ secrets.MONETIZATION_NEWSLETTER_URL }}
        run: node scripts/publish_all.js

      - name: 💾 Commit & Push Updated Topic Queue
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull --rebase origin ${{ github.ref_name }}
          git add data/topics.json src/data/current_short.json
          if git diff --staged --quiet; then
            echo "No queue changes to commit."
          else
            git commit -m "chore: advance topic queue [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: 📤 Archive Rendered Video Artifact
        if: always() && github.event.inputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-short-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 7
          if-no-files-found: ignore
